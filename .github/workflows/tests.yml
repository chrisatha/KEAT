name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.qt && ', Qt' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12", qt: true }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt for the window tests
        if: matrix.qt
        run: python -m pip install PySide6
      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes src tests tools
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          python -m pip install .
          keat --version
